<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Recognition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
    <main class="container">
        <h1>Digit Recognition</h1>
        <p class="subtitle">Draw a digit from 0 to 9 and check the model prediction.</p>

        <div class="layout">
            <section class="card">
                <h2>Input</h2>
                <canvas id="drawingCanvas" width="280" height="280"></canvas>

                <div class="buttons">
                    <button id="predictButton">Predict</button>
                    <button id="clearButton" class="secondary">Clear</button>
                </div>
            </section>

            <section class="card">
                <h2>Result</h2>

                <div class="result-box">
                    <div id="predictedDigit" class="digit-result">?</div>
                    <p id="confidence" class="confidence-text">Draw a digit to begin</p>
                </div>

                <h3>Probabilities</h3>
                <div id="probabilities"></div>

                <p id="errorMessage" class="error-message"></p>
            </section>
        </div>
    </main>
</body>
</html>
